name: dry-run

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Parse the example article (offline, no draft created)
        run: node bin/xpub.mjs --dry-run examples/sample-article.md
      - name: CLI help
        run: node bin/xpub.mjs --help
